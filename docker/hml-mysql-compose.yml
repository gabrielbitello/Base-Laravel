services:
  mysql:
    image: mysql:8.4
    container_name: hml-shared-mysql
    restart: unless-stopped
    ports:
      - "${HML_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${HML_MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - hml-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${HML_MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    networks:
      - hml

volumes:
  hml-mysql-data:

networks:
  hml:
    name: hml-shared
    driver: bridge

