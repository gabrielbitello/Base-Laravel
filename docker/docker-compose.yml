name: base-laravel

services:
  serve:
    build:
      context: ./serve
    container_name: base-laravel-serve
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ../:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - base-laravel

  mysql:
    image: mysql:8.4
    container_name: base-laravel-mysql
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-base-laravel}
      MYSQL_USER: ${DB_USERNAME:-base-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    networks:
      - base-laravel

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: base-laravel-phpmyadmin
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-base-laravel}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - base-laravel

volumes:
  mysql-data:

networks:
  base-laravel:
